name: Update events and deploy

on:
  schedule:
    # UTC 00:00 = Asia/Tokyo 09:00；GitHub 定时任务可能延迟。
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts/tests -v
      - name: Fetch official events
        run: python scripts/update_events.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test src/lib/interests.test.js
      - run: npm run build
      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/events.json src/data/update_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update events from official source"
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: vars.ENABLE_PAGES == 'true'
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
